name: check-portals

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # manual trigger

jobs:
  check:
    runs-on: ubuntu-latest    # 4 vCPU / 16GB RAM / 14GB SSD on public repos, free
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Regression Test Suite
        run: python -m pytest tests/

      - name: Run checks
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: "true"
        run: python -m checks.run_all

      - name: Commit and push results
        run: |
          git config user.name "setu-sentinel-bot"
          git config user.email "actions@github.com"
          git add data/ reports/
          git commit -m "Automated portal health snapshot $(date -u +%Y-%m-%dT%H-%M)" || echo "No changes"
          git pull --rebase origin main || true
          git push origin main
